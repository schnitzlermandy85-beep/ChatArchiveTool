<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天档案</title><style>body{margin:0;background:#f4f6f9;color:#263249;font:15px/1.65 system-ui}header{position:sticky;top:0;background:#fff;padding:18px 24px;border-bottom:1px solid #ddd;z-index:1}h1{font-size:24px;margin:0 0 12px}input,button{font:inherit;padding:7px 12px;border:1px solid #cdd4dd;border-radius:8px}#search{width:min(55%,550px)}main{max-width:1000px;margin:24px auto;padding:0 16px}.message{background:white;margin:16px 0;padding:18px;border-radius:14px;border-left:4px solid #7292bd}.system{opacity:.7;border-left-color:#bbb}.who{font-weight:600}.time,.note{font-size:12px;color:#6c7887}.body{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:280px;max-height:260px;display:block;margin:8px 0}audio,video{max-width:100%;display:block;margin:8px 0}.transcript{padding:10px;background:#edf4ff;border-radius:8px;margin-top:8px;white-space:pre-wrap}.missing{color:#a25d15}.pager{display:flex;gap:14px;justify-content:center;padding:20px}a{color:#365f9f}</style><header><h1>聊天档案 · 含语音文字</h1><input id="search" placeholder="搜索聊天文字或语音转写"><label><input id="systems" type="checkbox">系统消息</label><span id="count"></span><div class="note">语音文字为机器识别，请对照音频核验。缺失媒体单独标记；此档案不能证明历史记录完整。</div></header><main id="messages"></main><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><script>window.CHAT=[];</script><!--CHUNKS--><script>
let page=0,filtered=[];const $=id=>document.getElementById(id);function node(tag,text,cls){let e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}function render(){let q=$('search').value.toLowerCase();filtered=CHAT.filter(m=>($('systems').checked||!m.system)&&(!q||((m.analysisText||'')+' '+(m.sender.name||'')).toLowerCase().includes(q)));let pages=Math.max(1,Math.ceil(filtered.length/100));page=Math.min(page,pages-1);$('messages').replaceChildren();for(let m of filtered.slice(page*100,(page+1)*100)){let card=node('article','',m.system?'message system':'message');card.id='msg-'+m.id;card.append(node('span',m.sender.name||'未知','who'),node('div',new Date(m.timestamp).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' · 北京时间','time'));for(let p of m.parts){let e;if(['text','reply','qqemoji'].includes(p.type)){e=node('div',p.text,'body')}else if(!p.available){e=node('div','['+p.type+'文件缺失] '+p.filename,'missing')}else if(['image','sticker'].includes(p.type)){e=node('img');e.src=p.path;e.alt=p.type==='sticker'?'表情包':'图片';e.loading='lazy';e.onerror=()=>e.replaceWith(node('div','图片无法显示：'+p.filename,'missing'))}else if(p.type==='audio'&&p.path.toLowerCase().endsWith('.silk')){e=node('a','下载原始SILK语音（尚未解码）');e.href=p.path;e.download=p.filename}else if(p.type==='audio'){e=node('audio');e.controls=true;e.preload='none';e.src=p.path}else if(p.type==='video'){e=node('video');e.controls=true;e.preload='none';e.src=p.path}else{e=node('a',p.filename);e.href=p.path;e.download=p.filename}card.append(e);if(p.transcription){let t=p.transcription;card.append(node('div','语音转文字 · '+t.status+'\n'+(t.text||'未识别出文字，请试听原音频'),'transcript'))}}$('messages').append(card)}$('count').textContent=' '+filtered.length+' 条';$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=0;render()},180)};$('systems').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render();scrollTo(0,0)};$('next').onclick=()=>{page++;render();scrollTo(0,0)};render();</script></html>
